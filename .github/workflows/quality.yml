name: Odoo Quality Gate

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Quality Score Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine gate level
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "gate=pr" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "gate=merge" >> $GITHUB_OUTPUT
          else
            echo "gate=pre-commit" >> $GITHUB_OUTPUT
          fi

      - name: Run Quality Scanner
        run: |
          npx tsx src/tools/quality-cli.ts \
            --module ./ \
            --gate ${{ steps.gate.outputs.gate }} \
            --json > quality-report.json

      - name: Archive quality report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: quality-report.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  Quality Gate: ${{ steps.gate.outputs.gate }}"
          if [ -f quality-report.json ]; then
            SCORE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('quality-report.json','utf8')).overall_score)")
            THRESHOLD=$(node -e "console.log(JSON.parse(require('fs').readFileSync('quality-report.json','utf8')).threshold)")
            echo "  Overall Score: $SCORE/100 ($THRESHOLD)"
          fi
          echo "════════════════════════════════════════"
