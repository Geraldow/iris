name: Release — iris Package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ── Job 1: Build TypeScript + ZIP (Linux) ──────────────────────────────────
  build-ts:
    name: Build TypeScript + Package ZIP
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Extract version from tag
        id: version
        run: |
          REF="${GITHUB_REF}"
          if [[ "$REF" =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "✅ Version: $VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="0.0.0-manual"
            echo "ℹ️  Manual dispatch — using version: $VERSION"
          else
            echo "❌ Could not extract version from: $REF"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Package ZIP
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP="iris-v${VERSION}.zip"
          zip -r "$ZIP" \
            src/ knowledge/ prompts/ scripts/ \
            package.json package-lock.json tsconfig.json \
            README.md LICENSE \
            --exclude "scripts/*.ps1" \
            --exclude "node_modules/*" \
            --exclude "dist/*" \
            --exclude "db/*"
          echo "📦 $ZIP — $(ls -lh $ZIP | awk '{print $5}')"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-zip
          path: iris-v*.zip

  # ── Job 2: Compile iris-setup.exe (Windows) ────────────────────────────────
  build-exe:
    name: Compile iris-setup.exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile installer
        run: bun build scripts/setup.ts --compile --target bun-windows-x64 --outfile iris-setup.exe

      - name: Verify exe
        run: |
          if (Test-Path "iris-setup.exe") {
            $size = [math]::Round((Get-Item "iris-setup.exe").Length / 1MB, 1)
            Write-Host "✅ iris-setup.exe — $size MB"
          } else {
            Write-Host "❌ iris-setup.exe not found"
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-setup-exe
          path: iris-setup.exe

  # ── Job 3: Create GitHub Release ───────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ts, build-exe]
    steps:
      - name: Download ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: iris-zip

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: iris-setup-exe

      - name: List release assets
        run: ls -lh iris-v*.zip iris-setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "iris v${{ needs.build-ts.outputs.version }}"
          body: |
            ## iris v${{ needs.build-ts.outputs.version }}

            Intelligent multi-adapter AI CLI orchestrator — MCP server for Claude Code.

            ### One-click install (Windows)

            1. Download **`iris-setup.exe`** below
            2. Run it — auto-detects Google Drive, installs missing tools, compiles iris, registers MCP in Claude Code

            ### Manual install

            1. Download **`iris-v${{ needs.build-ts.outputs.version }}.zip`**
            2. Extract and run:
            ```powershell
            npm install
            npx tsc
            ```
            3. Add to `claude_desktop_config.json`:
            ```json
            {
              "mcpServers": {
                "iris": { "command": "node", "args": ["path/to/iris/dist/index.js"] }
              }
            }
            ```

            ### Adapters
            | Adapter | Primary phases |
            |---------|---------------|
            | claude (agy) | apply, propose, spec, tasks |
            | antigravity (Gemini) | explore, design, document |
            | codex, copilot, kilo, cursor, opencode | fallback |
          files: |
            iris-v${{ needs.build-ts.outputs.version }}.zip
            iris-setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "  iris Release Pipeline Complete"
          echo "  Version: v${{ needs.build-ts.outputs.version }}"
          echo "  Assets: iris-v${{ needs.build-ts.outputs.version }}.zip + iris-setup.exe"
          echo "════════════════════════════════════════"
